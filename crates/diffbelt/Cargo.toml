[package]
name = "diffbelt"
version = "0.0.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
debug_prints = []

[dependencies]
tokio = { version = "1.22.0", features = ["full"] }
hyper = { version = "0.14.23", features = ["full"] }
futures = "0.3.25"
rocksdb = { version = "0.21.0", features = ["multi-threaded-cf"] }
protobuf = "3.2.0"
rand = "0.8.5"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.91"
serde_with = "2.1.0"
regex = "1.7.0"
lazy_static = "1.4.0"
base64 = "0.20.0"
querystring = "1.1.0"
urlencoding = "2.1.2"
hashbrown = "0.14.3"
lru = "0.10.0"
enum-as-inner = "0.6.0"
thiserror = "1.0.50"
enum_dispatch = "0.3.12"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[dependencies.diffbelt_types]
path = "../diffbelt_types"

[dependencies.diffbelt_util]
path = "../diffbelt_util"

[dependencies.diffbelt_util_no_std]
path = "../diffbelt_util_no_std"

[dependencies.diffbelt_macro]
path = "../diffbelt_macro"

[dependencies.diffbelt_http_client]
path = "../diffbelt_http_client"

[dependencies.diffbelt_aligned_bytes]
path = "../diffbelt_aligned_bytes"

[dependencies.diffbelt_protos]
path = "../diffbelt_protos"

[build-dependencies]
protobuf-codegen = "3.2.0"
protoc-rust = "2.28.0"
