[package]
name = "diffbelt_cli"
version = "0.0.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.3.21", features = ["derive", "string"] }
tokio = { version = "1.22.0", features = ["full"] }
hyper = { version = "0.14.23", features = ["full"] }
thiserror = "1.0.50"
enum-as-inner = "0.6.0"
enum_dispatch = "0.3.12"
base64 = "0.20.0"
generational-arena = "0.2.9"
crossterm = "0.28.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[dependencies.diffbelt_types]
path = "../diffbelt_types"

[dependencies.diffbelt_util]
path = "../diffbelt_util"

[dependencies.diffbelt_util_no_std]
path = "../diffbelt_util_no_std"

[dependencies.diffbelt_http_client]
path = "../diffbelt_http_client"

[dependencies.diffbelt_cli_config]
path = "../diffbelt_cli_config"

[dependencies.diffbelt_transforms]
path = "../diffbelt_transforms"

[dependencies.diffbelt_protos]
path = "../diffbelt_protos"

[dependencies.diffbelt_wasm_binding]
path = "../diffbelt_wasm_binding"

[target.'cfg(debug_assertions)'.dependencies.diffbelt_example_wasm_rebuild]
path = "../../crates_example/diffbelt_example_wasm_rebuild"
[dev-dependencies.diffbelt_example_wasm_rebuild]
path = "../../crates_example/diffbelt_example_wasm_rebuild"
